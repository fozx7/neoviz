[package]
name = "neoviz"
version = "0.1.0"
edition = "2024"
description = "Retro-style system-audio visualizer for Windows and Linux"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
pollster = "1"
realfft = "3.5"
rtrb = "0.4"
wgpu = "30"
winit = "0.30"

[profile.release]
strip = true

# Slower to build (~35 s vs ~7 s for the final crate) but a bit smaller and
# faster. For packaged binaries: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"

[target."cfg(windows)".dependencies]
cpal = "0.18"
