[package]
name = "neoviz"
version = "0.9.0"
edition = "2024"
description = "Retro-style system-audio visualizer for Windows and Linux"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0.0"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
env_logger = "0.11"
keepawake = "0.6"
log = "0.4"
pollster = "1"
realfft = "3.5"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
wgpu = "30"
winit = "0.30"

[profile.release]
strip = true

# Slower to build (~35 s vs ~7 s for the final crate) but a bit smaller and
# faster. For packaged binaries: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

# MilkDrop (feature "milkdrop") on Linux and Windows; a no-op elsewhere.
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
glow = { version = "0.18", optional = true }
projectm = { version = "3.1", features = ["static"], optional = true }
projectm-sys = { version = "1.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"
khronos-egl = { version = "6", features = ["static"], optional = true }

[target."cfg(windows)".dependencies]
cpal = "0.18"
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["milkdrop"]
# MilkDrop presets via libprojectM (built from source; needs cmake and a C++
# compiler, plus OpenGL/EGL headers on Linux or vcpkg on Windows). Build
# without it with `--no-default-features`.
milkdrop = [
    "dep:projectm",
    "dep:projectm-sys",
    "dep:glow",
    "dep:khronos-egl",
    "dep:windows-sys",
]

# projectm-sys with its Windows build fixed; see vendor/README.md.
[patch.crates-io]
projectm-sys = { path = "vendor/projectm-sys" }
