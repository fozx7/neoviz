name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux audio and OpenGL dev libs
        if: runner.os == 'Linux'
        # OpenGL/EGL, cmake and g++ are for MilkDrop (projectM), on by default on Linux.
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libpulse-dev libegl-dev libgl-dev cmake g++

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Check without MilkDrop
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked --no-default-features -- -D warnings

      - name: Build release
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v7
        with:
          name: neoviz-${{ runner.os }}
          path: |
            target/release/neoviz
            target/release/neoviz.exe
          if-no-files-found: error

